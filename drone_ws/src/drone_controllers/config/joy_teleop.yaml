joy_teleop:
  ros__parameters:
    joy_topic: joy

    move:
      type: topic
      interface_type: geometry_msgs/msg/TwistStamped
      topic_name: /mellinger_controller/cmd_vel

      require_enable_button: true
      enable_button: 5

      axis_linear:
        x: 1
        y: 0
        z: 4

      scale_linear:
        x: 1.0
        y: 1.0
        z: 1.0

      axis_angular:
        yaw: 3

      scale_angular:
        yaw: 1.0